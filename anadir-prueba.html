<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sonidos de Añadir</title>
<style>
  :root { --ink: #141210; --paper: #FFF8E3; --blue: #1B4FD8; --yellow: #FFD21F; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--paper); color: var(--ink); font: 500 16px system-ui, sans-serif; }
  h1 { margin: 0 0 4px; font-size: 26px; }
  p { margin: 0 0 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; margin-bottom: 16px; }
  button { min-height: 104px; padding: 10px; border: 3px solid var(--ink); background: #dfe7ff; color: var(--ink); text-align: left; font: 500 14px system-ui, sans-serif; box-shadow: 3px 3px 0 var(--ink); touch-action: none; user-select: none; -webkit-user-select: none; }
  button b { display: block; margin-bottom: 4px; font-size: 19px; }
  button.on { background: var(--yellow); transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
  button.before { background: #fff; }
  label { display: block; margin-bottom: 10px; font-weight: 600; }
  input { display: block; width: 100%; }
</style>
</head>
<body>
  <h1>Sonidos de Añadir</h1>
  <p>Mantén pulsada una opción y suena hasta que sueltes. Mueve el ratón o el dedo: cuanto más rápido, más vivo.</p>
  <div class="grid" id="options"></div>
  <label>Volumen <input id="vol" type="range" min="0" max="1" step="0.05" /></label>
  <label>Presión del gatillo <input id="pressure" type="range" min="0" max="1" step="0.05" value="0.7" /></label>
  <label>Tamaño del pincel <input id="size" type="range" min="-7" max="7" step="1" value="0" /></label>

<script type="module">
  import { sfx } from './sonidos.js';
  import { Continuo, OPCIONES } from './anadir.js';
  const $ = (id) => document.getElementById(id);
  let engine = null, held = null;

  const release = () => {
    if (!held) return;
    held.b.classList.remove('on');
    if (held.id) engine.stop();
    held = null;
    sfx.play('release');
  };
  function press(id, b, e) {
    sfx.unlock();
    if (!sfx.ctx) return;
    engine ||= new Continuo(sfx.ctx, sfx.master);
    release();
    sfx.play('press', { semi: -+$('size').value });
    if (id) engine.start(id, -+$('size').value);
    held = { id, b, x: e.clientX, y: e.clientY, dist: 0, speed: 0, last: performance.now() };
    b.classList.add('on');
    requestAnimationFrame(frame);
  }
  function frame(now) {
    if (!held) return;
    const dt = Math.min(0.05, Math.max(0.001, (now - held.last) / 1000));
    held.last = now;
    const v = held.dist / dt / 1200; // 1200 píxeles por segundo = mano rápida
    held.dist = 0;
    held.speed += (v - held.speed) * Math.min(1, dt * 10);
    const pressure = +$('pressure').value, semi = -+$('size').value;
    if (held.id) engine.update(dt, held.speed, pressure, semi);
    else sfx.stroke('add', held.speed, pressure, dt, true, semi);
    requestAnimationFrame(frame);
  }
  const add = (id, name, hint, extra) => {
    const b = document.createElement('button');
    b.dataset.id = id;
    b.className = extra;
    b.innerHTML = `<b>${name}</b>${hint}`;
    b.addEventListener('pointerdown', (e) => press(id, b, e));
    $('options').appendChild(b);
  };
  for (const [id, op] of Object.entries(OPCIONES)) add(id, op.name, op.hint, '');
  add('', 'El de ahora', 'Para comparar: solo suena si mueves', 'before');

  addEventListener('pointermove', (e) => {
    if (!held) return;
    held.dist += Math.hypot(e.clientX - held.x, e.clientY - held.y);
    held.x = e.clientX;
    held.y = e.clientY;
  });
  for (const ev of ['pointerup', 'pointercancel', 'blur']) addEventListener(ev, release);
  $('vol').value = sfx.volume;
  $('vol').addEventListener('input', () => sfx.setVolume(+$('vol').value));
  window.__prueba = { sfx, OPCIONES, get engine() { return engine; } };
</script>
</body>
</html>
